<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC Clinic Portal - Student</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="page-student">

<div id="toast" role="status" aria-live="polite"></div>

<section id="view-student" class="view app">
  <header class="topbar">
    <img src="images/logo.png" alt="SPC Logo">
    <strong>SPC Clinic</strong>
    <nav>
      <button data-tab="home" class="active">Home</button>
      <button data-tab="appointment">Appointment</button>
      <button data-tab="notifications">Notifications <span id="notif-badge" class="badge hidden"></span></button>
      <button data-tab="profile">Edit Profile</button>
      <button id="logout-student" class="ghost">Log out</button>
    </nav>
  </header>

  <main>
    <!-- HOME TAB -->
    <div class="tab" id="tab-home">
      <h1>Welcome, <span id="h-welcome"></span></h1>
      <div class="card profile" style="text-align: center;">
        <img id="h-avatar" src="images/logo.png" alt="Profile Picture" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px auto; display: block; border: 3px solid var(--maroon); box-shadow: var(--shadow-md);">
        <div style="text-align: left;">
          <p><b>Name:</b> <span id="h-name"></span></p>
          <p><b>ID:</b> <span id="h-id"></span></p>
          <p><b>Age:</b> <span id="h-age"></span></p>
          <p><b>Gender:</b> <span id="h-gender"></span></p>
          <p><b>Role:</b> Student</p>
        </div>
      </div>
    </div>

    <!-- APPOINTMENT TAB -->
    <div class="tab hidden" id="tab-appointment">
      <h1>Appointment / HDF Request</h1>
      
      <!-- Clinic Hours Banner -->
      <div class="lookup" style="margin-bottom: 16px; border-left: 4px solid var(--teal);">
        <p style="margin: 0; font-size: 0.85rem; color: var(--muted);">
          <b>Clinic Hours:</b> Monday – Friday, 8:00 AM – 5:00 PM | Same-day or future scheduling available.
        </p>
      </div>

      <form class="card form" id="appt-form">
        <label>Student ID
          <input id="a-id" readonly style="opacity: 0.75; cursor: not-allowed; background: var(--bg);">
        </label>
        <label>Name
          <input id="a-name" readonly style="opacity: 0.75; cursor: not-allowed; background: var(--bg);">
        </label>

        <div class="row">
          <label>Date
            <input id="a-date" type="date" required>
          </label>
          <label>Time
            <input id="a-time" type="time" min="08:00" max="17:00" required>
          </label>
        </div>

        <!-- Dynamic Availability Notice -->
        <div id="date-notice" class="lookup hidden" style="border-left: 4px solid var(--warn);"></div>

        <fieldset><legend>Request Type</legend>
          <label class="inline"><input type="radio" name="a-type" value="Appointment" checked> Appointment</label>
          <label class="inline"><input type="radio" name="a-type" value="HDF"> Health Declaration Form (HDF)</label>
        </fieldset>

        <div id="doctor-group">
          <label>Attending Personnel / Duty Availability
            <select id="a-doctor">
              <option value="Nurse on Duty (No Doctor)">Nurse on Duty (No Doctor Available)</option>
              <option value="Working Student / Staff on Duty">Working Student / Staff on Duty</option>
              <option value="Dr. Santos (General Physician)">Dr. Santos (General Physician)</option>
              <option value="custom">Other / Specific Schedule Details...</option>
            </select>
          </label>

          <div id="custom-doctor-group" class="hidden" style="margin-top: 10px;">
            <label>Specify Personnel / Doctor Schedule
              <input id="a-doctor-custom" placeholder="e.g., Doctor available after 2:00 PM only">
            </label>
          </div>
        </div>

        <label>Reason for Visit / Request
          <textarea id="a-reason" rows="4" placeholder="e.g., Medical check-up, severe headache, dental referral, clearance submission..." required></textarea>
        </label>

        <div class="actions">
          <button class="btn primary" id="appt-submit-btn" type="submit">Submit Request</button>
          <button class="btn" type="button" data-tab="home">Cancel</button>
        </div>
      </form>
    </div>

    <!-- NOTIFICATIONS TAB -->
    <div class="tab hidden" id="tab-notifications">
      <h1>My Notifications</h1>
      <div id="notif-list" class="card"></div>
    </div>

    <!-- EDIT PROFILE TAB -->
    <div class="tab hidden" id="tab-profile">
      <h1>Edit Profile</h1>
      <form class="card form" id="profile-form" autocomplete="off">
        <label>Profile Picture
          <input id="p-avatar" type="file" accept="image/*">
        </label>
        <label>Name<input id="p-name" required></label>
        <label>Student ID<input id="p-id" required></label>
        <div class="row">
          <label>Age<input id="p-age" type="number" min="0"></label>
          <label>Gender<input id="p-gender"></label>
        </div>
        <label>Password<input id="p-pass" type="password" placeholder="Leave blank to keep current password"></label>
        <div class="actions"><button class="btn primary" type="submit">Save Changes</button><button class="btn" type="button" data-tab="home">Cancel</button></div>
      </form>
    </div>
  </main>
</section>

<dialog id="dlg"><h3 id="dlg-title"></h3><p id="dlg-body"></p><form method="dialog"><button class="btn primary">OK</button></form></dialog>
<dialog id="confirm-dlg"><h3 id="cd-title"></h3><p id="cd-body"></p><div class="actions"><button class="btn danger" id="cd-yes">Yes</button><button class="btn" id="cd-no">Cancel</button></div></dialog>

<script type="module" src="src/script.js"></script>
</body>
</html>
