<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPC Clinic Portal - Login</title>
  <link rel="icon" href="images/logo.png">
  <link rel="stylesheet" href="src/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body id="page-login">

<div id="toast" role="status" aria-live="polite"></div>

<section id="view-login" class="view auth">
  <div class="auth-card">
    <div class="auth-side">
      <img src="images/logo.png" alt="St. Peter's College logo">
      <h2>SPC Clinic Portal</h2>
      <p>Book appointments, request forms and get clinic updates.</p>
    </div>
    <form class="auth-form" id="login-form" autocomplete="off">
      <h1>Login</h1>
      <label>Full Name<input id="login-name" required></label>
      <label>Password<input id="login-pass" type="password" required></label>
      <button class="btn primary" type="submit">Login</button>
      <p class="alt">Don't have an account? <a href="signup.html">Sign up</a></p>
    </form>
  </div>
</section>

<dialog id="dlg"><h3 id="dlg-title"></h3><p id="dlg-body"></p><form method="dialog"><button class="btn primary">OK</button></form></dialog>
<dialog id="confirm-dlg"><h3 id="cd-title"></h3><p id="cd-body"></p><div class="actions"><button class="btn danger" id="cd-yes">Yes</button><button class="btn" id="cd-no">Cancel</button></div></dialog>

<script type="module" src="src/script.js"></script>
</body>
</html>
